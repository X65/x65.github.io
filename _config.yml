repository: X65/x65.github.io
url: https://x65.zone
title: X65 - Modern 8-bit computer for Creativity, Learning, and Retro Gaming
tagline: Modern 8-bit computer
description: |
  X65 is a modern 8-bit microcomputer built around the W65C816 CPU, featuring 16 MB flat RAM, custom CGIA video with 256-color palette, sprites, layers, and scrolling, SGU-1 synth and PCM audio, USB and Wi-Fi/Bluetooth, and its native OS/816 for multitasking, shell access, and low-level programming.

author:
  name: X65pc
twitter:
  username: X65pc
  card: summary_large_image
social:
  name: X65 Project
  links:
    - https://github.com/X65
    - https://matrix.to/#/#x65:chrome.pl
    - https://x.com/X65pc
    - https://www.youtube.com/@X65pc
    - https://www.facebook.com/groups/x65pc
logo: /assets/paw_logo_512.png
timezone: Europe/Warsaw

# `jekyll serve` only. The Wasm emulator is linked -sWASM_WORKERS/-sAUDIO_WORKLET, so its
# memory is a shared WebAssembly.Memory; handing that to the AudioWorklet needs the page to
# be cross-origin isolated. Without these the emulator still runs -- video and all -- and
# only sound dies, with "AudioWorklet thread initialization failed" in the console.
# Production (S3/CloudFront) already sends all three on every response; this mirrors them
# so local pages behave like the deployed site. Ignored outside `jekyll serve`.
webrick:
  headers:
    Cross-Origin-Opener-Policy: same-origin
    Cross-Origin-Embedder-Policy: require-corp
    Cross-Origin-Resource-Policy: cross-origin

plugins:
  - jekyll-github-metadata
  - jekyll-paginate
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

readme_index:
  enabled: true
  remove_originals: false
  with_frontmatter: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
