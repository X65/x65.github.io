- title: Four-Byte Burger
  img: 4BB.png
  xex: 4BB.xex
  src: https://git.chrome.pl/X65/examples/src/commit/d0b646/src/cgia/four_byte_burger.asm
  gallery: true
  desc: >-
    Senn's Four-Byte Burger, scrolling up and down. The picture is taller than the
    screen; the demo moves it by changing display list offsets during vertical
    blank, without copying the bitmap.
- title: Peggles<br>MODE7 carting
  img: peggles_mode7.png
  xex: peggles_mode7.xex&joystick=digital_1
  gallery: true
  desc: >-
    A karting demo with a MODE7 floor. Use a gamepad or joystick to drive.
- title: Sokoban<br>by Zbyti
  img: sokoban.png
  xex: sokoban.xex&joystick=digital_1
  desc: >-
    The first game to run on X65: zbyti's Sokoban, written in Mad Pascal with its
    own tile engine. Play with a joystick.
- title: Pikoban<br>by Zbyti
  img: pikoban.png
  xex: pikoban.xex&joystick=digital_1
  desc: >-
    Zbyti's compact µSoukoban, ported from Neo6502 to X65. Written in Mad Pascal,
    with small levels and joystick controls.
- title: Joy, GamePad, Kbd <br>test program
  img: controller.png
  xex: controller.xex&joystick=digital_1
  src: https://git.chrome.pl/X65/examples/src/commit/3f0fc4/src/io/controller.asm
  desc: >-
    A live input test for both DE-9 joysticks, USB gamepad and keyboard. Press a
    button or key to see its state on screen.
- title: Font & Code-Page<br>test program
  img: font_cp.png
  xex: font_cp.xex
  src: https://git.chrome.pl/X65/examples/src/commit/5daf1e/src/cgia/font_cp.asm
  desc: >-
    Browse the system font and its code pages. Press
    SPACE to switch pages.
- title: SMON <br>(Machine Monitor)
  img: SMON.png
  xex: SMON.xex
  src: https://github.com/X65/smon
  desc: >-
    The machine language monitor from 64'er magazine (1984), ported to X65. Includes
    a memory editor, assembler, disassembler and debugger. Open the emulator UART console
    and type `h` for help.
