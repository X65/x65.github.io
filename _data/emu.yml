- title: MODE0 (text,palette)<br>(+ MODE2)
  img: MODE0_text.png
  xex: MODE0_text.xex
  src: https://git.chrome.pl/X65/examples/src/commit/06a600/src/cgia/text_modes.asm
  gallery: true
  desc: >-
    CGIA's text modes side by side: MODE0 with a register palette and MODE2 with
    per-cell colours. Includes different bit depths, double-width and multicolor
    text, using a font fetched from RIA.
- title: MODE1 (bitmap,4bpp)<br>Lobo
  img: MODE1_lobo_2.png
  xex: MODE1_lobo_2.xex
  src: https://github.com/zbyti/x65-mode1-converter
  gallery: true
  desc: >-
    Lobo converted to a 384x240, 4 bpp bitmap by zbyti's x65-mode1-converter. Eight
    base colours plus half-bright shades give it 16 colours in 46 kB. The converter
    handles palette selection and dithering.
- title: MODE2 (text)<br>glyphs &amp; colors
  img: MODE2_hello-glyphs.png
  xex: MODE2_hello-glyphs.xex
  src: https://git.chrome.pl/X65/examples/src/commit/fc8de1/src/cgia/data/example_data.h#L7
  gallery: true
  desc: >-
    Our oldest demo: a screen full of glyphs and colours, with a "Hello World!" band
    in the middle. It's all memory blocks and a MODE2 display list; there's no CPU
    program to run.
- title: MODE2 (tiles)
  img: MODE2_SWBoy.png
  xex: MODE2_SWBoy.xex
  src: https://git.chrome.pl/X65/examples/src/commit/4ddd77/src/cgia/swboy.c
  gallery: true
  desc: >-
    A Wonder Boy style level made from 8x8 tiles in double-width, multicolor MODE2.
    About 40 lines of C set up the tile map, colours and display list.
- title: 80-column text<br>MODE2 4x8px font
  img: 80_columns.png
  xex: 80_columns.xex
  src: https://git.chrome.pl/X65/examples/src/commit/adcd27/src/cgia/text_80_columns.asm
  gallery: true
  desc: >-
    80 columns on a 320-pixel screen, using a 4x8 font in MODE2 multicolor. Each
    character still takes one byte and has its own colour attributes.
- title: MODE3 (hires)<br>Veto – The Mill
  img: MODE3_Veto-the_mill.png
  xex: MODE3_Veto-the_mill.xex
  src: https://csdb.dk/release/index.php?id=101528
  gallery: true
  desc: >-
    Veto's C64 hires picture from LCP 2011, converted to MODE3. Each 8-pixel-wide
    cell has a foreground and background colour, chosen from X65's 256-colour
    palette.
- title: MODE3 (multicolor)<br>Carrion – One Zak &amp;…
  img: MODE3_Carrion-One_Zak_And_His_Kracken.png
  xex: MODE3_Carrion-One_Zak_And_His_Kracken.xex
  src: https://plus4world.powweb.com/software/One_Zak_And_His_Kracken
  gallery: true
  desc: >-
    Carrion's Plus/4 FLI picture from Riverwash 2014. A MODE3 display list changes
    the colour cells every raster line, doing the work FLI needed the CPU for. Some
    shared colours clash in the conversion.
- title: MODE6 (HAM)<br>Farfar – perso1
  img: MODE6_Farfar-perso1.png
  xex: MODE6_Farfar-perso1.xex
  src: https://arnaud-carre.github.io/2022-12-30-amiga-ham/
  gallery: png
  desc: >-
    Farfar/lns, from Arnaud Carré's Amiga HAM article, converted to MODE6. X65's
    Hold-And-Modify mode packs four pixels into three bytes, fitting this 320x240
    photo into one 64 kB bank.
