- title: Sprites
  img: sprites.png
  xex: sprites.xex
  src: https://git.chrome.pl/X65/examples/src/commit/fc8de1/src/cgia/sprites.asm
  desc: >-
    Eight hardware sprites, moving during vertical blank. The demo tries clipping
    at the screen edges, mirroring and 1 bpp rendering. Each sprite's descriptor can
    link to another for multiplexing.
- title: Shadow Of The Beast
  img: SOTB.png
  xex: SOTB.xex
  src: https://git.chrome.pl/X65/examples/src/commit/fc8de1/src/cgia/sotb.asm
  gallery: true
  desc: >-
    The parallax scene from Shadow of the Beast, with graphics converted from the Amiga
    original. Three background planes and 19 raster splits handle the scenery and
    sky; two overlaid sprites give the beast six colours.
- title: Mixed Display Modes<br>…and affine rotator
  img: mixed_modes.png
  xex: mixed_modes.xex
  src: https://git.chrome.pl/X65/examples/src/commit/ba4215/src/cgia/mixed_modes.asm
  gallery: true
  desc: >-
    A rotating MODE7 mascot above MODE2 text, with a transparent HUD on another
    plane. The display list handles the split; a vertical blank handler updates the
    rotation from a sine table.
- title: Monty On The Run .sid<br>by Robert J. Hubbard
  img: MontyOnTheRun.png
  xex: MontyOnTheRun.xex
  src: https://git.chrome.pl/X65/examples/src/commit/68ba45/src/sound/MontyOnTheRun.asm
  desc: >-
    Rob Hubbard's original 1985 SID player, with its register writes translated to
    SGU-1 each frame. An early experiment in playing SID music on X65.
- title: Mystery Cannon .sid<br>by Zack Maxis
  img: Mystery_Cannon.png
  xex: Mystery_Cannon.xex
  src: https://deepsid.chordian.net/?file=/MUSICIANS/M/Manganoid/Mystery_Cannon_2SID.sid
  desc: >-
    Zack Maxis's (Manganoid) 2SID tune, played on six SGU-1 channels. This was the
    first music played on the breadboard prototype. The SID translation is still
    rough.
- title: PokeyMania<br>by 4-Mat
  img: Pokeymania.png
  xex: Pokeymania.xex
  src: https://csdb.dk/release/?id=148198
  desc: >-
    4-Mat's 2016 C64 take on Rob Hubbard's Atari tunes. SID imitating POKEY, now
    played through SGU-1's SID translation. Even the squares lost track of which chip they came from.
- title: OPL VGM playback<br>Tyrian, The Level
  img: opl.png
  xex: opl.xex
  src: https://git.chrome.pl/X65/examples/src/commit/4e0fe5/src/sound/opl.asm
  desc: >-
    "The Level" from Tyrian, played from an OPL2 VGM log. Uses karmic64's 64vgmplay,
    adapted from the C64 Sound Expander to drive SGU-1 FM.
- title: Alloyrun<br>by VOID
  img: alloyrun.png
  xex: alloyrun.xex
  src: https://tracker.x65.zone/?import=reality:/Modules/RAD-v1/Void/Void%20-%20Alloyrun.rad
  gallery: true
  desc: >-
    VOID's Reality AdLib Tracker tune, imported through SGU Tracker and exported
    with the SGM player. The original FM instruments map directly to SGU-1's
    operators.
- title: FM-Tronikk<br>by Malfunction
  img: fm-troni.png
  xex: fm-troni.xex
  gallery: true
  desc: >-
    Malfunction's FM-Tronikk, also known as Altair Street Dancer. Imported from
    AdLib Tracker II through SGU Tracker, with its four-operator FM instruments.
- title: Pinball Illusions<br>by Olof Gustafsson
  img: pinball_illusions.png
  xex: pinball_illusions.xex
  src: https://tracker.x65.zone/?import=modland:/Protracker/Blaizer/pinball%20illusions%20-%20intro.mod
  gallery: true
  desc: >-
    Olof Gustafsson's Amiga intro music, imported from ProTracker through SGU
    Tracker. The four sample channels play from SGU-1's 64 kB PCM memory.
- title: "E1M1: At Doom's Gate<br>by Bobby Prince"
  img: e1m1.png
  xex: e1m1.xex
  gallery: true
  desc: >-
    Doom's first level music by Bobby Prince, imported from a General MIDI file.
    Uses SGU Tracker's built-in GM instrument bank across nine channels.
- title: Draconus<br>by Adam Gilmore
  img: Draconus.png
  xex: Draconus.xex
  gallery: true
  desc: >-
    Adam Gilmore's Atari 8-bit tune, imported from SAP through SGU Tracker. POKEY's
    distortions and high-pass sounds are recreated with SGU-1 FM.
- title: Supremacy<br>by Jeroen Tel
  img: Supremacy.png
  xex: Supremacy.xex
  src: https://deepsid.chordian.net/?file=/MUSICIANS/T/Tel_Jeroen/Supremacy.sid&subtune=1
  gallery: true
  desc: >-
    Jeroen Tel's 1990 C64 title tune, first subtune, imported through SGU Tracker.
- title: Al-ya Trance…<br>by MmcM
  img: aLyaTrAn.png
  xex: aLyaTrAn.xex
  src: https://zxtunes.com/ru/authors/mmcm-sage?id=519&play=15839&md=1
  gallery: true
  desc: >-
    "Al-ya Trance from me for you" by MmcM of Sage, a ZX Spectrum PT3 module from
    2000. Three AY channels, with their envelopes and noise, imported through SGU
    Tracker.
- title: Aot… PETSCII Robots<br>Amiga title screen
  img: PetsciiRobots.png
  xex: PetsciiRobots.xex
  gallery: true
  desc: >-
    The Amiga title screen from Attack of the PETSCII Robots, converted to X65's
    palette. This is a still image; the menu isn't interactive.
- title: Dune I<br>Chani encounter
  img: Dune_Chani.png
  xex: Dune_Chani.xex
  gallery: png
  desc: >-
    Chani from Cryo's Dune (1992), converted to MODE6 HAM. A still picture with the
    original's desert colours and sky gradient.
