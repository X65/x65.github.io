- title: Raster Bars
  img: raster_bars.png
  xex: raster_bars.xex
  src: https://git.chrome.pl/X65/examples/src/commit/7db42d/src/cgia/raster_bars.asm
  gallery: true
  desc: >-
    Scrolling raster bars in under 40 lines of assembly. The CPU watches the raster
    register and changes the background colour on each line.
